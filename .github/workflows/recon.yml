name: Recon Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install recon tools
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go jq curl
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest

      - name: Run recon
        run: ./scripts/recon.sh

      - name: Upload recon artifact
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ github.run_number }}
          path: results/latest/
          if-no-files-found: warn

      - name: Persist results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/ || true
          git diff --cached --quiet || git commit -m 'Update recon results'
          git push || true
