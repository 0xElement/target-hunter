name: Repo Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  repo-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN_HUNTER }}
    steps:
      - uses: actions/checkout@v4
      - name: Install scanner dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep python3
      - name: Hunt authorized public repositories
        run: python3 scripts/repo_hunter.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-hunt-${{ github.run_number }}
          path: results/repo-hunt/latest/
          if-no-files-found: warn
      - name: Persist sanitized results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/repo-hunt/ || true
          git diff --cached --quiet || git commit -m 'Update repo hunting results'
          git push || true
